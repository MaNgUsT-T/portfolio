file_uploads = On
memory_limit = -1
# memory_limit = 512M
max_execution_time = 50000
# max_execution_time = 90
max_input_vars = 5000
post_max_size = 64M
upload_max_filesize = 64M
; Align with production server
max_input_time = -1
date.timezone = Europe/Berlin

; Disable OPcache/JIT locally to avoid PHP-FPM segfaults during admin requests
opcache.enable = 0
opcache.jit = 0
opcache.jit_buffer_size = 0
