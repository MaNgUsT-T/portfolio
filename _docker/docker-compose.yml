name: ${PROJECT_NAME}
services:
  db:
    image: mariadb:${DB_VERSION}
    container_name: ${PROJECT_NAME}_db
    restart: always
    environment:
      TZ: Europe/Berlin
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - cl_network
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER || MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 10s

  php:
    build:
      context: ./php
      args:
        PHP_VERSION: ${PHP_VERSION}
        WP_CLI_VERSION: ${WP_CLI_VERSION}
        HOST_UID: ${HOST_UID:?HOST_UID fehlt in _docker/.env. Bitte in _docker/.env einen Wert setzen.}
        HOST_GID: ${HOST_GID:?HOST_GID fehlt in _docker/.env. Bitte in _docker/.env einen Wert setzen.}
        IMAGE_BUILD_SIGNATURE: ${IMAGE_BUILD_SIGNATURE:-unknown}
    image: ${PHP_IMAGE}:${PHP_VERSION}
    container_name: ${PROJECT_NAME}_php
    restart: always
    environment:
      TZ: Europe/Berlin
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_HOST: db
    volumes:
      - ../:/var/www/html:cached
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./php/mail.ini:/usr/local/etc/php/conf.d/mail.ini:ro
      - ./php/config.php.local:/var/www/html/config.php:ro
    networks:
      - cl_network
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit((int)!@fsockopen(\"127.0.0.1\",9000));'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  apache:
    image: httpd:${APACHE_VERSION}
    container_name: ${PROJECT_NAME}_apache
    restart: always
    environment:
      TZ: Europe/Berlin
    volumes:
      - ../:/var/www/html:cached
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro

    networks:
      - cl_network
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=dev-proxy
      - traefik.http.routers.${PROJECT_NAME}.entrypoints=web
      - traefik.http.routers.${PROJECT_NAME}.rule=Host(`${VIRTUAL_HOST}`)
      - traefik.http.services.${PROJECT_NAME}.loadbalancer.server.port=80
    depends_on:
      php:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:${PHPMYADMIN_VERSION}
    container_name: ${PROJECT_NAME}_phpmyadmin
    restart: always
    environment:
      TZ: Europe/Berlin
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - cl_network
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=dev-proxy
      - traefik.http.routers.${PROJECT_NAME}_pma.entrypoints=web
      - traefik.http.routers.${PROJECT_NAME}_pma.rule=Host(`${PHPMYADMIN_HOST}`)
      - traefik.http.services.${PROJECT_NAME}_pma.loadbalancer.server.port=80
    depends_on:
      - db

  mailhog:
    image: mailhog/mailhog:${MAILHOG_VERSION}
    container_name: ${PROJECT_NAME}_mailhog
    restart: always
    environment:
      TZ: Europe/Berlin
    networks:
      - cl_network
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=dev-proxy
      - traefik.http.routers.${PROJECT_NAME}_mailhog.entrypoints=web
      - traefik.http.routers.${PROJECT_NAME}_mailhog.rule=Host(`${MAILHOG_HOST}`)
      - traefik.http.services.${PROJECT_NAME}_mailhog.loadbalancer.server.port=8025

volumes:
  db_data:
    name: ${PROJECT_NAME}_db_data

networks:
  cl_network:
    name: ${PROJECT_NAME}_cl_network
  proxy:
    external: true
    name: dev-proxy
